name: Build and Release
on: [workflow_dispatch, push]
env:
  PROJ_DIR: .
jobs:
  build-android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ${{ env.PROJ_DIR }}}}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
      - uses: actions/setup-java@v5
        with: {java-version: '17', distribution: 'jetbrains'}
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v5
        with: {name: android-apk, path: ${{ env.PROJ_DIR }}/build/app/outputs/flutter-apk/app-release.apk}
  build-ios:
    runs-on: macos-latest
    defaults: {run: {working-directory: ${{ env.PROJ_DIR }}}}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
      - run: sudo gem install cocoapods
      - run: cd ios && pod repo update && pod install
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v5
        with: {name: ios-app, path: ${{ env.PROJ_DIR }}/build/ios/iphoneos/Runner.app}
  build-macos:
    runs-on: macos-latest
    defaults: {run: {working-directory: ${{ env.PROJ_DIR }}}}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
      - run: sudo gem install cocoapods
      - run: cd macos && pod repo update && pod install
      - run: flutter pub get
      - run: flutter build macos --release
      - uses: actions/upload-artifact@v5
        with: {name: macos-app, path: ${{ env.PROJ_DIR }}/build/macos/Build/Products/Release/*.app}
  build-windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: ${{ env.PROJ_DIR }}}}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
      - run: flutter pub get
      - run: flutter build windows --release --cmake-options "-G Visual Studio 17 2022 -A x64"
      - uses: actions/upload-artifact@v5
        with: {name: windows-app, path: ${{ env.PROJ_DIR }}/build/windows/runner/Release/*.exe}
  build-linux:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: ${{ env.PROJ_DIR }}}}
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - uses: actions/upload-artifact@v5
        with: {name: linux-app, path: ${{ env.PROJ_DIR }}/build/linux/x64/release/bundle}
